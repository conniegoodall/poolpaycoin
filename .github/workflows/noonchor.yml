name: build-win64-noonchor
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and mingw
        run: |
          sudo -S -p '' apt-get update
          sudo -S -p '' apt-get install -y build-essential libtool autotools-dev automake pkg-config bsdmainutils python3 curl ca-certificates git cmake g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64
          sudo -S -p '' update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo -S -p '' update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Disable the 189 re-anchor (test build)
        run: |
          sed -i 's/consensus.nASERTReanchorHeight = 189;/consensus.nASERTReanchorHeight = 21000000;/' src/kernel/chainparams.cpp
          grep -n "nASERTReanchorHeight" src/kernel/chainparams.cpp

      - name: Build depends (Windows x64, no Qt)
        run: make -C depends -j$(nproc) HOST=x86_64-w64-mingw32 NO_QT=1

      - name: autogen
        run: ./autogen.sh

      - name: configure
        run: ./configure --prefix=$PWD/depends/x86_64-w64-mingw32 --without-gui --disable-tests --disable-bench --disable-fuzz-binary --without-miniupnpc --without-natpmp

      - name: make
        run: make -j$(nproc)

      - uses: actions/upload-artifact@v4
        with:
          name: poolpaycoin-win64-noonchor
          path: |
            src/poolpaycoind.exe
            src/poolpaycoin-cli.exe
