name: build-win64
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autotools-dev automake \
            pkg-config bsdmainutils python3 curl ca-certificates git

      - name: Build depends (Windows x64)
        run: make -C depends -j$(nproc) HOST=x86_64-w64-mingw32 NO_QT=1

      - name: autogen
        run: ./autogen.sh

      - name: configure
        run: ./configure --prefix=$(pwd)/depends/x86_64-w64-mingw32 \
          --without-gui --disable-tests --disable-bench --disable-fuzz-binary \
          --without-miniupnpc --without-natpmp

      - name: make
        run: make -j$(nproc)

      - name: Show what we built
        run: ls -l src/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: poolpaycoin-win64
          path: |
            src/poolpaycoind.exe
            src/poolpaycoin-cli.exe
